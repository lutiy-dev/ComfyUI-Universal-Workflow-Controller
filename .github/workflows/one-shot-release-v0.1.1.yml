name: One-shot Release v0.1.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-release-v0.1.1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create GitHub release v0.1.1
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.1 already exists; nothing to do."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          First public release of **ComfyUI Universal Workflow Controller (UWC)** by **OVizLAB**.

          ### Included
          - Universal Stage Controller
          - Universal Exclusive Switch
          - Bind Selected / rebind
          - per-entry MUTE / BYPASS
          - SOLO with exact RESTORE
          - All On / All Off
          - workflow-local persistence
          - workflow-tab persistence
          - missing-target detection and Clean Missing
          - cross-controller overlap diagnostics

          ### Validation
          - real ComfyUI Nodes 2.0 runtime acceptance: PASS for the tested core matrix
          - automated tests: PASS
          - Comfy Registry validation and pack: PASS
          - Comfy Registry publish: PASS

          ### Scope
          Core workflow-control behavior is TESTED. Subgraph-container support remains outside the STABLE claim until its dedicated runtime acceptance test is completed.

          ### License
          MIT
          EOF

          gh release create v0.1.1             --repo "$GITHUB_REPOSITORY"             --target "eaec4fec18ebca7f7e1b796d4a378839443a9570"             --title "Universal Workflow Controller v0.1.1"             --notes-file /tmp/release-notes.md
